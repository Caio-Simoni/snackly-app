<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-t6264lZ+tU5NV0XBc0rLYfQNk2V5B+TChNvAXaqhogE='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFBF2">
<title>Snackly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Snackly, protótipo da demonstração. Ficha: design-system/snackly/DESIGN.md
   Layout: barra de abas no topo; "Ao vivo" põe o celular do aluno ao lado do painel da cozinha. */
:root{
  --bg:#FFFBF2; --card:#FFFEFA; --line:#EDE3CF; --ink:#211B14; --soft:#6E6455; --mid:#4A4136;
  --y:#FFC21A; --y2:#FFF0C2; --yline:#F2D78A; --mus:#8A5A00;
  --ok:#1F7A53; --okbg:#E3F1EA; --bad:#B42318; --badbg:#FBE9E7; --onink:#FFFBF2; --scrim:rgba(33,27,20,.45);
  --f-disp:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --f-body:'DM Sans',Arial,sans-serif;
  --f-mono:'JetBrains Mono','Courier New',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4}
p,h1,h2,h3{margin:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:-.5px;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.soft{color:var(--soft)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mus)}
.num{font-variant-numeric:tabular-nums}

/* topo */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.5px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{padding:9px 16px;border-radius:999px;font-weight:700;font-size:15px;color:var(--soft);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--y2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--y)}
.reset{font-size:14px;font-weight:700;color:var(--soft);padding:8px 14px;border-radius:999px;border:2px solid var(--line);white-space:nowrap;flex:none}
.reset.arm{border-color:var(--bad);color:var(--bad)}

.wrap{max-width:1440px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view[hidden]{display:none}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.center{display:flex;justify-content:center}

/* celular */
.phone{width:390px;max-width:100%;height:clamp(600px,calc(100vh - 130px),820px);background:var(--ink);border-radius:54px;padding:12px;flex:none}
.ph{position:relative;height:100%;background:var(--bg);border-radius:43px;overflow:hidden;display:flex;flex-direction:column}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font-size:13px;font-weight:700}
.ph-status i{display:block;width:96px;height:22px;border-radius:999px;background:var(--ink)}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px 12px}
.who{display:flex;align-items:center;gap:10px;text-align:left;border-radius:999px;padding:4px 12px 4px 4px;border:2px solid var(--line);background:var(--card)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--y);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.who b{display:block;font-size:14px;line-height:1.1}
.who small{display:block;font-size:12px;color:var(--soft)}
.wallet{margin:0 18px 10px;padding:10px 14px;border-radius:16px;background:var(--y2);display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mid)}
.wallet b{color:var(--ink)}
.ph-body{flex:1;overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px}
.ph-foot{border-top:2px solid var(--line);background:var(--card);padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px}
.ph-tabs{display:flex;gap:6px}
.ph-tabs button{flex:1;padding:9px;border-radius:12px;font-size:14px;font-weight:700;color:var(--soft)}
.ph-tabs button[aria-pressed="true"]{background:var(--y2);color:var(--ink)}

.hello{font-size:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex:none}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:14px;font-weight:700;white-space:nowrap;color:var(--mid)}
.chip[aria-pressed="true"]{background:var(--y);border-color:var(--y);color:var(--ink)}
.cat-h{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mus);margin-top:4px}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 10px 10px 10px}
.tile{width:52px;height:52px;border-radius:16px;background:var(--y2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tile svg{width:28px;height:28px}
.item b{display:block;font-size:16px;line-height:1.2}
.item small{display:block;font-size:13px;color:var(--soft);line-height:1.3}
.item .pr{font-weight:700;font-size:14px;margin-top:2px}
.add{width:40px;height:40px;border-radius:14px;background:var(--y);display:flex;align-items:center;justify-content:center}
.add svg{width:20px;height:20px}
.qty{display:flex;align-items:center;gap:6px}
.qty span{min-width:18px;text-align:center;font-weight:700}
.qty button{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--card)}
.qty button.y{background:var(--y);border-color:var(--y)}
.qty svg{width:16px;height:16px}
.item.off{opacity:.55}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--bad)}
.lock svg{width:13px;height:13px}
.note{border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.bad b{color:var(--bad)}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.y{background:var(--y2);color:var(--mid)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:999px;background:var(--ink);color:var(--onink);font-size:16px;font-weight:700}
.btn.y{background:var(--y);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.auto{width:auto}
.cartbar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 20px;border-radius:999px;background:var(--ink);color:var(--onink);font-weight:700}
.cartbar span:last-child{color:var(--y)}

.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.total{font-family:var(--f-disp);font-weight:800;font-size:24px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--soft);align-self:flex-start}
.back svg{width:16px;height:16px}

.code{background:var(--y);border-radius:24px;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.code p:first-child{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:3px}
.code p:last-child{font-family:var(--f-mono);font-weight:700;font-size:84px;line-height:1;letter-spacing:-3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.steps i{display:block;height:8px;border-radius:4px;background:var(--line)}
.steps .on i{background:var(--y)}
.steps .on{color:var(--ink);font-weight:700}
.big-st{font-size:32px}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr canvas{width:200px;height:200px;border-radius:12px;border:2px solid var(--line);background:#fff;image-rendering:pixelated}
.copy{display:flex;gap:8px;align-items:center}
.copy input{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--mid)}
.copy button{font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;background:var(--y2)}
.hist{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--y2);color:var(--mid);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.k{background:var(--ink);color:var(--y)}

/* aviso flutuante */
.banner{position:absolute;left:12px;right:12px;top:44px;z-index:3;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:6px 6px 0 var(--ink);animation:drop .45s cubic-bezier(.2,.8,.2,1)}
.banner b{display:block;font-family:var(--f-disp);font-size:18px}
.banner p{font-size:14px;color:var(--mid)}
@keyframes drop{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}

/* cozinha */
.kit{display:flex;flex-direction:column;gap:18px;min-width:0}
.kit-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.kit-head h2{font-size:32px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kcol{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:420px;min-width:0}
.kcol h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.kcol h3 span{font-family:var(--f-body);font-size:13px;font-weight:700;background:var(--y2);border-radius:999px;padding:2px 10px}
.kcol.ready{background:var(--y2);border-color:var(--y2)}
.kcard{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.kcol.ready .kcard{background:var(--card);border-color:var(--yline)}
.kcard.fresh{animation:fresh 2.4s ease}
@keyframes fresh{0%,40%{background:var(--y);border-color:var(--ink)}100%{}}
.kcard .kc{font-family:var(--f-mono);font-weight:700;font-size:30px;line-height:1;letter-spacing:-1px}
.kcard ul{margin:0;padding:0;list-style:none;font-size:15px;display:flex;flex-direction:column;gap:2px}
.kcard ul b{font-variant-numeric:tabular-nums}
.since.late{background:var(--badbg);color:var(--bad)}
.empty{font-size:14px;color:var(--soft);text-align:center;padding:24px 8px}
.kcard .btn{padding:11px 14px;font-size:15px}

/* admin e pais */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h2{font-size:32px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi.y{background:var(--y);border-color:var(--y)}
.kpi.y .eyebrow{color:var(--ink)}
.kpi strong{font-family:var(--f-disp);font-weight:800;font-size:32px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi small{font-size:13px;color:var(--soft)}
.kpi.y small{color:var(--mid)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:24px}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--y)}
.chart .bar.now{fill:var(--ink)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--soft);font-family:var(--f-body);font-size:12px}
.chart .val{fill:var(--ink);font-weight:700}
.rank{display:flex;flex-direction:column;gap:10px}
.rank-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:15px}
.rank-row i{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--y2)}
.rank-row i b{display:block;height:100%;border-radius:4px;background:var(--y)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mus);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.price{width:96px;font:inherit;font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.add-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.add-form input,.add-form select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.add-form input[type=text]{flex:1 1 180px}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .2s}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{transform:translateX(18px)}
.p-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.money{font-family:var(--f-disp);font-weight:800;font-size:44px;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;background:var(--y)}
.meter b.full{background:var(--bad)}
input[type=range]{width:100%;accent-color:var(--ink)}
.allow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 24px}
.allow h4{grid-column:1/-1;margin:8px 0 0;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mus)}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line);font-size:15px}
.hrow:last-child{border-bottom:0}
.hrow small{display:block;color:var(--soft);font-size:13px}

/* app do aluno: abas com ícone, login, carteira e conta */
.ph-tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:12px}
.ph-tabs svg{width:22px;height:22px}
.login{flex:1;overflow-y:auto;padding:26px 22px 22px;display:flex;flex-direction:column;gap:14px}
.login-mark{display:flex;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mid)}
.field input{font:inherit;font-size:16px;font-weight:500;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.acc,.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;width:100%}
.acc[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--ink)}
.acc small,.opt small{display:block;font-size:12px;color:var(--soft)}
.opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] i{border:6px solid var(--ink)}
.link{font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;color:var(--mid);align-self:center;padding:6px}
.wcard{background:var(--y);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.wcard .money{font-size:40px}
.amts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.amts button{padding:12px 4px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.amts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--y)}
.set{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:2px 16px}
.set .line{padding:12px 0;border-bottom:2px solid var(--line);font-size:15px}
.set .line:last-child{border-bottom:0}
.set small{display:block;font-size:12px;color:var(--soft)}
.prof{display:flex;align-items:center;gap:14px}
.prof .av{width:56px;height:56px;font-size:22px}

/* painel de gestão */
.head-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--y)}
.kpi .delta{font-weight:700}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.kpi.y .delta{color:var(--ink)}
.split{display:flex;height:28px;gap:2px;border-radius:8px;overflow:hidden}
.split b{display:block;height:100%}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px;color:var(--mid)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-columns:38px repeat(15,minmax(20px,1fr));gap:3px;font-size:12px;color:var(--soft);min-width:440px}
.heat i{display:block;height:28px;border-radius:5px}
.heat span{text-align:center}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.35;background:var(--y2);color:var(--mid)}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.alert b{color:inherit}
.gate{max-width:440px;margin:32px auto;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:16px}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--onink);font-size:13px;font-weight:600;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
.chart .hit{fill:transparent}
.chart g:hover .bar{opacity:.8}

/* janela e aviso */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}

/* ---------- estado ---------- */
var S, ui={tab:'ao-vivo',sid:'rafa',cat:'tudo',cart:{},screen:'menu',orderId:null,blocked:null,pixAt:0,notif:null,flash:{},resetArm:0,modal:null,
  logged:true,loginSid:'rafa',loginErr:'',payM:'pix',topV:30,notifOff:false,per:1};

/* histórico de exemplo para o painel: 60 dias fechados antes de hoje (domingo a cantina não abre) */
function mkDays(now){
  var r=rng(4242),out=[],base=new Date(now);base.setHours(12,0,0,0);
  for(var i=60;i>=1;i--){
    var d=new Date(+base-i*86400e3),wd=d.getDay();
    if(wd===0){out.push({t:+d,ped:0,fat:0,pix:0,cli:0,rec:0,tm:0});continue;}
    var f=wd===6?.45:wd===5?.9:1,trend=1+(60-i)*.004,ped=Math.round((92+r()*26)*f*trend);
    out.push({t:+d,ped:ped,fat:r2(ped*(13.2+r()*1.4)),pix:Math.round(ped*(.7+r()*.1)),cli:Math.round(ped*(.58+r()*.06)),rec:Math.round(ped*(2.3+r()*.8)/10)*10,tm:r2(4.2+r()*1.6)});
  }
  return out;
}

function seed(){
  var now=Date.now(), r=rng(20261113), menu=MENU0.map(function(m){return Object.assign({on:true},m);});
  var orders=[], mid=new Date(); mid.setHours(0,1,0,0);
  var start=Math.max(now-4*3600e3,mid.getTime()), end=Math.max(start+60e3,now-25*60e3);
  var times=[];
  for(var i=0;i<38;i++){var pk=[.15,.5,.85][i%3];times.push(start+(end-start)*Math.min(.99,Math.max(0,pk+(r()-.5)*.24)));}
  times.sort(function(a,b){return a-b;});
  var pool=['xsalada','misto','coxinha','coxinha','paoqueijo','esfiha','suco','suco','refri','agua','cafe','brigadeiro','bolopote','frutas','wrap'];
  times.forEach(function(t,i){
    var items=[],n=1+Math.floor(r()*3),seen={};
    for(var k=0;k<n;k++){var id=pool[Math.floor(r()*pool.length)];if(seen[id]){seen[id].q++;continue;}var m=menu.find(function(x){return x.id===id;});seen[id]={id:id,n:m.n,p:m.p,q:1};items.push(seen[id]);}
    var davi=(i===18);
    if(davi) items=[{id:'paoqueijo',n:'Pão de queijo',p:6,q:1},{id:'agua',n:'Água',p:3.5,q:1}];
    var prep=(3+r()*5)*60e3;
    orders.push({id:'h'+i,code:i+1,sid:davi?'davi':null,nome:davi?'Davi':NOMES[Math.floor(r()*NOMES.length)],items:items,total:r2(items.reduce(function(s,x){return s+x.p*x.q;},0)),pay:davi?'saldo':(r()<.8?'pix':'saldo'),st:'entregue',t:{pago:t,prep:t+50e3,pronto:t+prep,entregue:t+prep+90e3}});
  });
  var ontem=new Date(now-86400e3);ontem.setHours(10,5,0,0);var o2=new Date(now-86400e3);o2.setHours(15,20,0,0);
  orders.unshift({id:'y1',code:27,sid:'davi',nome:'Davi',items:[{id:'misto',n:'Misto quente',p:9,q:1},{id:'suco',n:'Suco de laranja',p:7,q:1}],total:16,pay:'saldo',st:'entregue',t:{pago:+ontem,pronto:+ontem+5*60e3,entregue:+ontem+7*60e3}});
  orders.unshift({id:'y2',code:61,sid:'davi',nome:'Davi',items:[{id:'brigadeiro',n:'Brigadeiro',p:3,q:2}],total:6,pay:'saldo',st:'entregue',t:{pago:+o2,pronto:+o2+2*60e3,entregue:+o2+3*60e3}});
  function live(code,nome,items,st,ago){var t=now-ago*60e3,o={id:'l'+code,code:code,sid:null,nome:nome,items:items,total:r2(items.reduce(function(s,x){return s+x.p*x.q;},0)),pay:'pix',st:st,t:{pago:t}};if(st!=='novo')o.t.prep=t+60e3;if(st==='pronto')o.t.pronto=now-60e3;return o;}
  orders.push(live(39,'Bruno',[{id:'coxinha',n:'Coxinha',p:7,q:2},{id:'refri',n:'Refrigerante lata',p:6,q:1}],'pronto',8));
  orders.push(live(40,'Lívia',[{id:'wrap',n:'Wrap de frango',p:15,q:1},{id:'suco',n:'Suco de laranja',p:7,q:1}],'prep',5));
  orders.push(live(41,'Mateus',[{id:'misto',n:'Misto quente',p:9,q:1},{id:'cafe',n:'Café com leite',p:5,q:1}],'novo',1));
  var y3=new Date(now-86400e3);y3.setHours(12,10,0,0);
  orders.unshift({id:'y3',code:87,sid:'rafa',nome:'Rafaela',items:[{id:'paoqueijo',n:'Pão de queijo',p:6,q:1},{id:'cafe',n:'Café com leite',p:5,q:1}],total:11,pay:'saldo',st:'entregue',t:{pago:+y3,pronto:+y3+4*60e3,entregue:+y3+6*60e3}});
  var rec=new Date(now-86400e3);rec.setHours(7,40,0,0);var recR=new Date(now-86400e3);recR.setHours(11,52,0,0);
  return {v:2,day:dayKey(now),nextCode:42,menu:menu,orders:orders,days:mkDays(now),recHoje:260,carteiras:1186.5,

/* o que vem do armazenamento do navegador pode ter sido mexido: só aceita no formato esperado, senão recomeça do zero */
var RX_ID=/^[\w-]{1,40}$/,STS=['novo','prep','pronto','entregue'],PAYS=['pix','saldo'],CATK=CATS.slice(1).map(function(c){return c[0];});
function isNum(v,lo,hi){return typeof v==='number'&&isFinite(v)&&v>=lo&&v<=hi;}
function isInt(v,lo,hi){return isNum(v,lo,hi)&&Math.floor(v)===v;}
function isStr(v,max){return typeof v==='string'&&v.length<=max;}
function isArr(v,max){return Array.isArray(v)&&v.length<=max;}
var T0=0,T1=4102444800000;
function okItem(i){return i&&RX_ID.test(i.id)&&isStr(i.n,60)&&isNum(i.p,0,999)&&isInt(i.q,1,99);}
function okOrder(o){
  if(!o||!RX_ID.test(o.id)||!isInt(o.code,1,999)||!isStr(o.nome,60)||!isArr(o.items,30)||!o.items.length||!o.items.every(okItem))return false;
  if(!(o.sid===null||o.sid==='rafa'||o.sid==='davi'))return false;
  if(!isNum(o.total,0,30000)||STS.indexOf(o.st)<0||PAYS.indexOf(o.pay)<0||!o.t||!isNum(o.t.pago,T0,T1))return false;
  return ['prep','pronto','entregue'].every(function(k){return o.t[k]===undefined||isNum(o.t[k],T0,T1);});
}
function okMenu(m){return m&&RX_ID.test(m.id)&&isStr(m.n,60)&&isStr(m.d||'',80)&&CATK.indexOf(m.c)>=0&&isNum(m.p,0.01,999)&&typeof m.on==='boolean';}
function okRec(r){return r&&isNum(r.t,T0,T1)&&isNum(r.v,0.01,1000);}
function okDay(d){return d&&isNum(d.t,T0,T1)&&['ped','fat','pix','cli','rec','tm'].every(function(k){return isNum(d[k],0,1e7);});}
function validState(s){
  if(!s||s.v!==2||!isStr(s.day,40)||!isInt(s.nextCode,1,999)||!isNum(s.recHoje,0,1e6)||!isNum(s.carteiras,0,1e7))return false;
  if(!isArr(s.orders,2000)||!s.orders.every(okOrder)||!isArr(s.menu,60)||!s.menu.length||!s.menu.every(okMenu)||!isArr(s.days,90)||!s.days.every(okDay))return false;
  var w=s.wallet,r=s.wrafa;
  if(!w||!isNum(w.saldo,0,1e5)||!isNum(w.limite,5,60)||!isArr(w.bloq,60)||!w.bloq.every(function(id){return RX_ID.test(id);})||!isArr(w.rec,500)||!w.rec.every(okRec))return false;
  if(!isArr(w.tent,500)||!w.tent.every(function(x){return x&&isNum(x.t,T0,T1)&&isStr(x.motivo,200)&&isNum(x.v,0,30000);}))return false;
  if(!(w.pedido===null||w.pedido===undefined||isNum(w.pedido,T0,T1)))return false;
  if(!r||!isNum(r.saldo,0,1e5)||!isArr(r.rec,500)||!r.rec.every(okRec))return false;
  return true;
}
function load(){try{var s=JSON.parse(localStorage.getItem(LS));if(validState(s)&&s.day===dayKey(Date.now()))return s;}catch(e){}return seed();}
function wal(sid){return sid==='davi'?S.wallet:S.wrafa;}
/* sessão do aluno e do gestor ficam só neste aparelho */
var SESS='snackly-sessao',GEST='snackly-gestor';
function rdLS(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function wrLS(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
var bc=null;try{bc=new BroadcastChannel('snackly');bc.onmessage=function(e){if(e.data==='sync'){var n=load();S=n;detect();render();}};}catch(e){}
window.addEventListener('storage',function(e){if(e.key===LS){S=load();detect();render();}});
function commit(){save();try{bc&&bc.postMessage('sync');}catch(e){}detect();render();}

/* mudanças de status viram aviso: pedido novo toca na cozinha, pedido pronto avisa o aluno */
var known=null;
function detect(){
  var first=!known;if(first)known={};
  S.orders.forEach(function(o){
    var was=known[o.id];
    if(!first&&!was&&o.st==='novo'){ui.flash[o.id]=Date.now();chime('novo');}
    if(!first&&was&&was!=='pronto'&&o.st==='pronto'&&o.sid&&!ui.notifOff){ui.notif={id:o.id,code:o.code,sid:o.sid,at:Date.now()};chime('pronto');setTimeout(function(){if(ui.notif&&ui.notif.id===o.id){ui.notif=null;render();}},9000);}
    known[o.id]=o.st;
  });
}

/* som */
var ac=null;
document.addEventListener('pointerdown',function(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}},{once:true});
function chime(kind){
  if(!ac)return;var notes=kind==='pronto'?[660,880,1175]:[523,784];
  notes.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.13;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.4);});
}

/* ---------- regras ---------- */
function menuItem(id){return S.menu.find(function(m){return m.id===id;});}
function spentToday(){return r2(S.orders.filter(function(o){return o.sid==='davi'&&o.pay==='saldo'&&isToday(o.t.pago);}).reduce(function(s,o){return s+o.total;},0));}
function cartList(){return Object.keys(ui.cart).map(function(id){return {m:menuItem(id),q:ui.cart[id]};}).filter(function(x){return x.m&&x.q>0;});}
function cartTotal(){return r2(cartList().reduce(function(s,x){return s+x.m.p*x.q;},0));}
function cartCount(){return cartList().reduce(function(s,x){return s+x.q;},0);}
function check(){
  var list=cartList(),total=cartTotal(),errs=[],why=[];
  list.forEach(function(x){if(!x.m.on){errs.push('<b>'+esc(x.m.n)+'</b> acabou. Tire da sacola para continuar.');}});
  if(ui.sid==='davi'){
    var w=S.wallet;
    list.forEach(function(x){if(w.bloq.indexOf(x.m.id)>=0){errs.push('<b>'+esc(x.m.n)+'</b> foi bloqueado pelo seu responsável.');why.push('Item bloqueado: '+x.m.n);}});
    var g=spentToday(),resta=r2(w.limite-g);
    if(total>resta+.001){errs.push('Passa do limite diário. Hoje já foram '+brl(g)+' de '+brl(w.limite)+'; dá para gastar mais '+brl(Math.max(0,resta))+'.');why.push('Limite diário de '+brl(w.limite));}
    if(total>w.saldo+.001){errs.push('Saldo insuficiente: há '+brl(w.saldo)+' na carteira.');why.push('Saldo insuficiente');}
  }else if(ui.payM==='saldo'&&total>S.wrafa.saldo+.001){errs.push('Saldo insuficiente: há '+brl(S.wrafa.saldo)+' na carteira. Adicione saldo ou pague no Pix.');}
  return {list:list,total:total,errs:errs,why:why};
}
function logTry(why,total){S.wallet.tent.unshift({t:Date.now(),motivo:why.join(' · '),v:total});}
function activeOrder(sid){var a=S.orders.filter(function(o){return o.sid===sid&&o.st!=='entregue';});return a[a.length-1]||null;}
function createOrder(pay){
  var c=check();if(c.errs.length||!c.list.length)return;
  var o={id:'o'+Date.now(),code:S.nextCode,sid:ui.sid,nome:ALUNOS[ui.sid].curto,items:c.list.map(function(x){return {id:x.m.id,n:x.m.n,p:x.m.p,q:x.q};}),total:c.total,pay:pay,st:'novo',t:{pago:Date.now()}};
  S.nextCode=S.nextCode>=999?1:S.nextCode+1;
  S.orders.push(o);if(pay==='saldo'){var w=wal(ui.sid);w.saldo=r2(w.saldo-c.total);}
  ui.cart={};ui.screen='order';ui.orderId=o.id;commit();
  /* no celular sozinho não tem ninguém na cozinha: ela anda sozinha para o aluno ver o pedido ficar pronto */
  if(isSolo()){autoStep(o.id,'novo',4000);autoStep(o.id,'prep',12000);}
}
function autoStep(id,from,ms){setTimeout(function(){var o=S.orders.find(function(x){return x.id===id;});if(o&&o.st===from)advance(id);},ms);}

/* celular de verdade (tela estreita) abrindo o app: só o app do aluno, em tela cheia */

function isSolo(){return SOLO.matches&&(ui.tab==='ao-vivo'||ui.tab==='aluno');}

/* QR de exemplo: só visual */
function drawQR(){
  var cv=document.getElementById('qr');if(!cv)return;var x=cv.getContext('2d'),n=33,r=rng(S.nextCode*7919);
  x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#211B14';
  for(var i=0;i<n;i++)for(var j=0;j<n;j++)if(r()<.48)x.fillRect(i,j,1,1);
  [[0,0],[n-7,0],[0,n-7]].forEach(function(p){x.fillStyle='#fff';x.fillRect(p[0]-1<0?0:p[0]-1,p[1]-1<0?0:p[1]-1,9,9);x.fillStyle='#211B14';x.fillRect(p[0],p[1],7,7);x.fillStyle='#fff';x.fillRect(p[0]+1,p[1]+1,5,5);x.fillStyle='#211B14';x.fillRect(p[0]+2,p[1]+2,3,3);});
}

function advance(id){
  var o=S.orders.find(function(x){return x.id===id;});if(!o)return;var now=Date.now();
  if(o.st==='novo'){o.st='prep';o.t.prep=now;}
  else if(o.st==='prep'){o.st='pronto';o.t.pronto=now;}
  else if(o.st==='pronto'){o.st='entregue';o.t.entregue=now;}
  commit();
}

function kpi(l,v,s,cls){return '<div class="kpi'+(cls?' '+cls:'')+'"><p class="eyebrow">'+l+'</p><strong>'+v+'</strong><small>'+s+'</small></div>';}
function dlt(c,p,lowerBetter){
  if(!p)return 'sem base para comparar';
  var d=(c-p)/p*100,flat=Math.abs(d)<.5,good=lowerBetter?d<0:d>0;
  return '<span class="delta '+(flat?'':good?'up':'down')+'">'+(flat?'=':d>0?'▲':'▼')+' '+pct(Math.abs(d))+'</span> vs. período anterior';
}
function todayDay(){
  var t=S.orders.filter(function(o){return isToday(o.t.pago);}),rd=t.filter(function(o){return o.t.pronto;}),seen={},rec=S.recHoje;
  t.forEach(function(o){seen[o.nome]=1;});
  [S.wallet,S.wrafa].forEach(function(w){w.rec.forEach(function(r){if(isToday(r.t))rec+=r.v;});});
  var tm=rd.length?rd.reduce(function(s,o){return s+(o.t.pronto-o.t.pago);},0)/rd.length/60000:0;
  return {ped:t.length,fat:r2(t.reduce(function(s,o){return s+o.total;},0)),pix:t.filter(function(o){return o.pay==='pix';}).length,cli:Object.keys(seen).length,rec:rec,tm:tm};
}
function agg(ds){var a={ped:0,fat:0,pix:0,cli:0,rec:0,tmw:0};ds.forEach(function(d){a.ped+=d.ped;a.fat+=d.fat;a.pix+=d.pix;a.cli+=d.cli;a.rec+=d.rec;a.tmw+=d.tm*d.ped;});a.fat=r2(a.fat);return a;}
/* barras: uma série, pontas de cima arredondadas, alvo de toque maior que a barra */
function bars(o){
  var W=640,H=250,pl=58,pb=28,pt=20,n=o.vals.length,mx=Math.max.apply(null,o.vals.concat([1]));
  var st=niceStep(mx/4),top=Math.ceil(mx/st)*st,cw=(W-pl-6)/n,bw=Math.max(4,Math.min(46,cw*.64)),ih=H-pt-pb,every=o.every||1;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+o.aria+'">';
  for(var g=0;g<=top+.001;g+=st){var y=pt+ih*(1-g/top);s+='<line class="grid" x1="'+pl+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+o.yfmt(g)+'</text>';}
  o.vals.forEach(function(v,i){
    var bh=ih*v/top,x=pl+cw*i+(cw-bw)/2,y=H-pb-bh,r=Math.min(4,bw/2,bh);
    s+='<g><rect class="hit" x="'+(pl+cw*i)+'" y="'+pt+'" width="'+cw+'" height="'+ih+'" data-tip="'+esc(o.tips[i])+'"/>';
    if(v>0)s+='<path class="bar'+(i===o.hi?' now':'')+'" pointer-events="none" d="M'+x+' '+(H-pb)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+bw-r)+'Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+'V'+(H-pb)+'Z"/>';
    s+='</g>';
    if(o.vlab&&v)s+='<text class="val" x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle">'+(o.vfmt?o.vfmt(v):v)+'</text>';
    if((n-1-i)%every===0)s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+o.labs[i]+'</text>';
  });
  return s+'</svg>';
}

var HEATC=['#FFF6DA','#FFE59A','#FFD04D','#FFC21A','#D99A00','#8A5A00'];
function heat(){
  var PROF={7:.25,8:.55,9:.9,10:1,11:.6,12:.95,13:.8,14:.45,15:.7,16:.5,17:.35,18:.55,19:.85,20:.7,21:.3},DF=[1,1.05,1,1.1,.9,.45],DN=['Seg','Ter','Qua','Qui','Sex','Sáb'],r=rng(77),vals=[],mx=0;
  DN.forEach(function(d,i){vals[i]=[];for(var hh=7;hh<=21;hh++){var v=Math.round(16*PROF[hh]*DF[i]*(.85+r()*.3));vals[i].push(v);if(v>mx)mx=v;}});
  var h='<div class="heat-wrap"><div class="heat" role="img" aria-label="Mapa de calor de pedidos por dia da semana e hora"><span></span>';
  for(var hh=7;hh<=21;hh++)h+='<span>'+(hh%2?hh+'h':'')+'</span>';
  DN.forEach(function(d,i){h+='<span style="text-align:left">'+d+'</span>';vals[i].forEach(function(v,j){var b=Math.min(5,Math.floor(v/mx*6));h+='<i style="background:'+HEATC[b]+'" data-tip="'+d+', '+(j+7)+'h · cerca de '+v+' pedidos"></i>';});});
  h+='</div></div><div class="legend"><span>menos</span>'+HEATC.map(function(c){return '<i style="background:'+c+'"></i>';}).join('')+'<span>mais pedidos</span></div>';
  return h;
}
function topItems(per){

  else S.days.slice(-per).forEach(function(d){Object.keys(POP).forEach(function(id){cnt[id]=(cnt[id]||0)+Math.round(d.ped*1.55*POP[id]);});});
  var ids=Object.keys(cnt).filter(function(id){return menuItem(id);}).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,5),mx=ids.length?cnt[ids[0]]:1;
  return '<div class="panel"><h3>Mais vendidos</h3><div class="rank">'+ids.map(function(id){var m=menuItem(id);return '<div class="rank-row" data-tip="'+esc(m.n)+' · '+cnt[id]+' vendidos · '+brl(cnt[id]*m.p)+'"><span>'+esc(m.n)+' <span class="soft" style="font-size:13px">'+brl(cnt[id]*m.p)+'</span></span><b class="num">'+cnt[id].toLocaleString('pt-BR')+'</b><i><b style="width:'+Math.round(cnt[id]/mx*100)+'%"></b></i></div>';}).join('')+'</div></div>';

  var solo=isSolo(),tab=solo?'aluno':ui.tab;
  document.body.classList.toggle('solo',solo);
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===ui.tab);});
  document.querySelectorAll('.view').forEach(function(v){v.hidden=v.id!=='v-'+tab;});
  var pb=document.getElementById('phbody'),st=pb?pb.scrollTop:0,ks=window.scrollY;
  ['h-phone-a','h-phone-b','h-kit-a','h-kit-b'].forEach(function(id){document.getElementById(id).innerHTML='';});
  if(tab==='ao-vivo'){document.getElementById('h-phone-a').innerHTML=phone(false);document.getElementById('h-kit-a').innerHTML=kitchen();}
  if(tab==='aluno')document.getElementById('h-phone-b').innerHTML=phone(true);
  if(tab==='cozinha')document.getElementById('h-kit-b').innerHTML=kitchen();
  document.getElementById('v-admin').innerHTML=tab==='admin'?admin():'';
  document.getElementById('v-pais').innerHTML=tab==='pais'?parents():'';
  var nb=document.getElementById('phbody');if(nb&&ui.keepScroll)nb.scrollTop=st;ui.keepScroll=false;
  drawQR();modal();tick();
}
function modal(){
  var m=document.getElementById('modal');
  if(!ui.modal){m.innerHTML='';return;}
  m.innerHTML='<div class="modal" data-a="close-modal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Recarga no Pix"><p class="eyebrow">Recarga para o Davi</p><h3 style="font-size:24px">Pague '+brl(ui.modal.v)+' no Pix</h3><div class="qr"><canvas id="qr" width="33" height="33" aria-label="QR Code de exemplo"></canvas></div><p class="note y">Pix simulado para a apresentação.</p><button class="btn y" data-a="topup-ok">Simular pagamento aprovado</button><button class="btn ghost" data-a="close-modal">Cancelar</button></div></div>';
  drawQR();
}
function toast(t){var el=document.createElement('div');el.className='toast';el.textContent=t;document.getElementById('toasts').appendChild(el);setTimeout(function(){el.remove();},3500);}
function tick(){
  document.querySelectorAll('[data-clock]').forEach(function(e){e.textContent=hm(Date.now());});
  document.querySelectorAll('[data-since]').forEach(function(e){var t=+e.dataset.since;e.textContent=sinceTxt(t);if(e.dataset.late==='1')e.classList.toggle('late',mins(Date.now()-t)>=8);});
  var p=document.querySelector('[data-pix]');if(p){var left=Math.max(0,300-Math.floor((Date.now()-ui.pixAt)/1000));p.textContent=Math.floor(left/60)+':'+('0'+left%60).slice(-2);}
}
setInterval(tick,1000);

/* ---------- ações ---------- */
document.addEventListener('click',function(e){
  var tb=e.target.closest('.tab');if(tb){location.hash=tb.dataset.tab;return;}
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
  if(a==='close-modal'&&b.classList.contains('modal')&&e.target!==b)return;
  switch(a){
    case 'pick-acc':ui.loginSid=id;ui.loginErr='';render();break;
    case 'login':
      var em=(document.getElementById('lg-email').value||'').trim().toLowerCase(),pw=document.getElementById('lg-pass').value;
      var who=Object.keys(ALUNOS).filter(function(k){return ALUNOS[k].email===em;})[0];
      if(!who){ui.loginErr='Não achamos essa conta. Use uma das contas de demonstração.';render();break;}
      if(!pw){ui.loginErr='Digite a senha.';render();break;}
      ui.sid=who;ui.logged=true;ui.loginErr='';ui.cart={};ui.screen='menu';ui.blocked=null;ui.payM='pix';wrLS(SESS,{sid:who});render();toast('Entrou como '+ALUNOS[who].curto+'.');break;
    case 'logout':ui.logged=false;ui.loginSid=ui.sid==='rafa'?'davi':'rafa';ui.cart={};ui.screen='menu';ui.notif=null;wrLS(SESS,{out:true});render();break;
    case 'to-admin':location.hash='admin';break;
    case 'paym':ui.payM=b.dataset.m;ui.keepScroll=true;render();break;
    case 'amt':ui.topV=+b.dataset.v;render();break;
    case 'me-topup-ok':var mw=wal(ui.sid);mw.saldo=r2(mw.saldo+ui.topV);mw.rec.push({t:Date.now(),v:ui.topV});ui.screen='wallet';commit();toast('Recarga de '+brl(ui.topV)+' confirmada. Saldo: '+brl(mw.saldo)+'.');break;
    case 'ask-topup':S.wallet.pedido=Date.now();commit();toast('Pedido de recarga enviado ao Marcos.');break;
    case 'gestor-in':wrLS(GEST,{at:Date.now()});ui.per=1;render();window.scrollTo(0,0);toast('Painel liberado.');break;
    case 'gestor-out':wrLS(GEST,null);render();window.scrollTo(0,0);break;
    case 'per':ui.per=+b.dataset.v;render();break;
    case 'cat':ui.cat=b.dataset.c;ui.blocked=null;render();break;
    case 'inc':
      if(ui.sid==='davi'&&S.wallet.bloq.indexOf(id)>=0){ui.blocked=id;ui.keepScroll=true;logTry(['Item bloqueado: '+menuItem(id).n],menuItem(id).p);commit();break;}
      ui.blocked=null;if(!menuItem(id))break;ui.cart[id]=Math.min(20,(ui.cart[id]||0)+1);ui.keepScroll=true;render();break;
    case 'dec':ui.cart[id]=Math.max(0,(ui.cart[id]||0)-1);if(!ui.cart[id])delete ui.cart[id];ui.keepScroll=true;if(ui.screen==='cart'&&!cartCount())ui.screen='menu';render();break;
    case 'go':ui.screen=b.dataset.s;ui.blocked=null;if(ui.screen==='topup-pix')ui.pixAt=Date.now();render();break;
    case 'open-order':ui.orderId=id;ui.screen='order';render();break;
    case 'to-pix':var c=check();if(c.errs.length){render();break;}ui.pixAt=Date.now();ui.screen='pix';render();break;
    case 'pix-ok':createOrder('pix');toast('Pix aprovado. Pedido enviado para a cozinha.');break;
    case 'pay-saldo':var c2=check();if(c2.errs.length){if(c2.why.length){logTry(c2.why,c2.total);commit();}else render();break;}createOrder('saldo');toast('Pago com saldo. Pedido enviado para a cozinha.');break;
    case 'copy':var inp=document.getElementById('pixcode');try{navigator.clipboard.writeText(inp.value).then(function(){toast('Código Pix copiado.');},function(){inp.select();});}catch(err){inp.select();}break;
    case 'adv':advance(id);break;
    case 'topup':ui.modal={v:+b.dataset.v};modal();break;
    case 'topup-ok':S.wallet.saldo=r2(S.wallet.saldo+ui.modal.v);S.wallet.rec.push({t:Date.now(),v:ui.modal.v});S.wallet.pedido=null;toast('Recarga de '+brl(ui.modal.v)+' confirmada.');ui.modal=null;commit();break;
    case 'close-modal':ui.modal=null;modal();break;
    case 'reset':
      if(ui.resetArm&&Date.now()-ui.resetArm<4000){S=seed();known=null;ui.cart={};ui.screen='menu';ui.notif=null;ui.blocked=null;ui.resetArm=0;ui.sid='rafa';ui.payM='pix';ui.logged=!SOLO.matches;wrLS(SESS,null);b.textContent='Reiniciar demo';b.classList.remove('arm');commit();toast('Demo reiniciada.');}
      else{ui.resetArm=Date.now();b.textContent='Confirmar reinício';b.classList.add('arm');setTimeout(function(){if(ui.resetArm&&Date.now()-ui.resetArm>=4000){ui.resetArm=0;b.textContent='Reiniciar demo';b.classList.remove('arm');}},4100);}
      break;
  }
});
function parsePrice(v){var n=parseFloat(String(v).slice(0,12).replace(/[^\d,.-]/g,'').replace(',','.'));return isFinite(n)&&n>0&&n<=999?r2(n):null;}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.price){var m=menuItem(t.dataset.price),n=parsePrice(t.value);if(n===null){toast('Preço inválido. Use um valor como 7,50.');t.value=m.p.toFixed(2).replace('.',',');return;}m.p=n;commit();toast(m.n+' agora custa '+brl(n)+'.');}
  else if(t.dataset.on){menuItem(t.dataset.on).on=t.checked;commit();}
  else if(t.dataset.allow){var b=S.wallet.bloq,i=b.indexOf(t.dataset.allow);if(t.checked&&i>=0)b.splice(i,1);if(!t.checked&&i<0)b.push(t.dataset.allow);commit();}
  else if(t.id==='lim'){S.wallet.limite=+t.value;commit();}
  else if(t.hasAttribute('data-notif')){ui.notifOff=!t.checked;toast(t.checked?'Aviso de pedido pronto ligado.':'Aviso de pedido pronto desligado.');}
});
document.addEventListener('input',function(e){if(e.target.id==='lim'){document.getElementById('lim-out').textContent=brl(+e.target.value);}});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addform')return;e.preventDefault();
  var n=document.getElementById('new-n').value.trim(),c=document.getElementById('new-c').value,p=parsePrice(document.getElementById('new-p').value);
  if(!n||p===null){toast('Preencha o nome e o preço do item.');return;}
  S.menu.push({id:'x'+Date.now(),n:n,c:c,p:p,d:'',on:true});commit();toast(n+' entrou no cardápio.');
});
var TABS=['ao-vivo','aluno','cozinha','admin','pais'];
function route(){var h=location.hash.slice(1);ui.tab=TABS.indexOf(h)>=0?h:'ao-vivo';ui.modal=null;render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

/* dica ao passar o mouse ou tocar nos gráficos */
var tipEl=document.getElementById('tip');
function showTip(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tipEl.hidden=true;return;}tipEl.textContent=el.getAttribute('data-tip');tipEl.hidden=false;var x=Math.min(Math.max(e.clientX,90),window.innerWidth-90);tipEl.style.left=x+'px';tipEl.style.top=e.clientY+'px';}
document.addEventListener('pointermove',showTip);
document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',function(){tipEl.hidden=true;},true);

/* quem já entrou neste aparelho continua dentro; no celular, quem chega pelo QR vê a tela de entrada */
var ss=rdLS(SESS);
if(ss&&ss.sid&&ALUNOS[ss.sid]){ui.logged=true;ui.sid=ss.sid;}else if(ss&&ss.out){ui.logged=false;}else{ui.logged=!SOLO.matches;}
S=load();detect();route();
})();
</script>
