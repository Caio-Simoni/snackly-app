<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF2">
<title>Snackly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Snackly, protótipo da demonstração. Ficha: design-system/snackly/DESIGN.md
   Layout: barra de abas no topo; "Ao vivo" põe o celular do aluno ao lado do painel da cozinha. */
:root{
  --bg:#FFFBF2; --card:#FFFEFA; --line:#EDE3CF; --ink:#211B14; --soft:#6E6455; --mid:#4A4136;
  --y:#FFC21A; --y2:#FFF0C2; --yline:#F2D78A; --mus:#8A5A00;
  --ok:#1F7A53; --okbg:#E3F1EA; --bad:#B42318; --badbg:#FBE9E7; --onink:#FFFBF2; --scrim:rgba(33,27,20,.45);
  --f-disp:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --f-body:'DM Sans',Arial,sans-serif;
  --f-mono:'JetBrains Mono','Courier New',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4}
p,h1,h2,h3{margin:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:-.5px;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.soft{color:var(--soft)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mus)}
.num{font-variant-numeric:tabular-nums}

/* topo */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.5px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{padding:9px 16px;border-radius:999px;font-weight:700;font-size:15px;color:var(--soft);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--y2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--y)}
.reset{font-size:14px;font-weight:700;color:var(--soft);padding:8px 14px;border-radius:999px;border:2px solid var(--line);white-space:nowrap;flex:none}
.reset.arm{border-color:var(--bad);color:var(--bad)}

.wrap{max-width:1440px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view[hidden]{display:none}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.center{display:flex;justify-content:center}

/* celular */
.phone{width:390px;max-width:100%;height:clamp(600px,calc(100vh - 130px),820px);background:var(--ink);border-radius:54px;padding:12px;flex:none}
.ph{position:relative;height:100%;background:var(--bg);border-radius:43px;overflow:hidden;display:flex;flex-direction:column}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font-size:13px;font-weight:700}
.ph-status i{display:block;width:96px;height:22px;border-radius:999px;background:var(--ink)}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px 12px}
.who{display:flex;align-items:center;gap:10px;text-align:left;border-radius:999px;padding:4px 12px 4px 4px;border:2px solid var(--line);background:var(--card)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--y);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.who b{display:block;font-size:14px;line-height:1.1}
.who small{display:block;font-size:12px;color:var(--soft)}
.wallet{margin:0 18px 10px;padding:10px 14px;border-radius:16px;background:var(--y2);display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mid)}
.wallet b{color:var(--ink)}
.ph-body{flex:1;overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px}
.ph-foot{border-top:2px solid var(--line);background:var(--card);padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px}
.ph-tabs{display:flex;gap:6px}
.ph-tabs button{flex:1;padding:9px;border-radius:12px;font-size:14px;font-weight:700;color:var(--soft)}
.ph-tabs button[aria-pressed="true"]{background:var(--y2);color:var(--ink)}

.hello{font-size:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex:none}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:14px;font-weight:700;white-space:nowrap;color:var(--mid)}
.chip[aria-pressed="true"]{background:var(--y);border-color:var(--y);color:var(--ink)}
.cat-h{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mus);margin-top:4px}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 10px 10px 10px}
.tile{width:52px;height:52px;border-radius:16px;background:var(--y2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tile svg{width:28px;height:28px}
.item b{display:block;font-size:16px;line-height:1.2}
.item small{display:block;font-size:13px;color:var(--soft);line-height:1.3}
.item .pr{font-weight:700;font-size:14px;margin-top:2px}
.add{width:40px;height:40px;border-radius:14px;background:var(--y);display:flex;align-items:center;justify-content:center}
.add svg{width:20px;height:20px}
.qty{display:flex;align-items:center;gap:6px}
.qty span{min-width:18px;text-align:center;font-weight:700}
.qty button{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--card)}
.qty button.y{background:var(--y);border-color:var(--y)}
.qty svg{width:16px;height:16px}
.item.off{opacity:.55}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--bad)}
.lock svg{width:13px;height:13px}
.note{border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.bad b{color:var(--bad)}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.y{background:var(--y2);color:var(--mid)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:999px;background:var(--ink);color:var(--onink);font-size:16px;font-weight:700}
.btn.y{background:var(--y);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.auto{width:auto}
.cartbar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 20px;border-radius:999px;background:var(--ink);color:var(--onink);font-weight:700}
.cartbar span:last-child{color:var(--y)}

.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.total{font-family:var(--f-disp);font-weight:800;font-size:24px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--soft);align-self:flex-start}
.back svg{width:16px;height:16px}

.code{background:var(--y);border-radius:24px;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.code p:first-child{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:3px}
.code p:last-child{font-family:var(--f-mono);font-weight:700;font-size:84px;line-height:1;letter-spacing:-3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.steps i{display:block;height:8px;border-radius:4px;background:var(--line)}
.steps .on i{background:var(--y)}
.steps .on{color:var(--ink);font-weight:700}
.big-st{font-size:32px}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr canvas{width:200px;height:200px;border-radius:12px;border:2px solid var(--line);background:#fff;image-rendering:pixelated}
.copy{display:flex;gap:8px;align-items:center}
.copy input{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--mid)}
.copy button{font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;background:var(--y2)}
.hist{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--y2);color:var(--mid);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.k{background:var(--ink);color:var(--y)}

/* aviso flutuante */
.banner{position:absolute;left:12px;right:12px;top:44px;z-index:3;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:6px 6px 0 var(--ink);animation:drop .45s cubic-bezier(.2,.8,.2,1)}
.banner b{display:block;font-family:var(--f-disp);font-size:18px}
.banner p{font-size:14px;color:var(--mid)}
@keyframes drop{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}

/* cozinha */
.kit{display:flex;flex-direction:column;gap:18px;min-width:0}
.kit-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.kit-head h2{font-size:32px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kcol{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:420px;min-width:0}
.kcol h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.kcol h3 span{font-family:var(--f-body);font-size:13px;font-weight:700;background:var(--y2);border-radius:999px;padding:2px 10px}
.kcol.ready{background:var(--y2);border-color:var(--y2)}
.kcard{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.kcol.ready .kcard{background:var(--card);border-color:var(--yline)}
.kcard.fresh{animation:fresh 2.4s ease}
@keyframes fresh{0%,40%{background:var(--y);border-color:var(--ink)}100%{}}
.kcard .kc{font-family:var(--f-mono);font-weight:700;font-size:30px;line-height:1;letter-spacing:-1px}
.kcard ul{margin:0;padding:0;list-style:none;font-size:15px;display:flex;flex-direction:column;gap:2px}
.kcard ul b{font-variant-numeric:tabular-nums}
.since.late{background:var(--badbg);color:var(--bad)}
.empty{font-size:14px;color:var(--soft);text-align:center;padding:24px 8px}
.kcard .btn{padding:11px 14px;font-size:15px}

/* admin e pais */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h2{font-size:32px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi.y{background:var(--y);border-color:var(--y)}
.kpi.y .eyebrow{color:var(--ink)}
.kpi strong{font-family:var(--f-disp);font-weight:800;font-size:32px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi small{font-size:13px;color:var(--soft)}
.kpi.y small{color:var(--mid)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:24px}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--y)}
.chart .bar.now{fill:var(--ink)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--soft);font-family:var(--f-body);font-size:12px}
.chart .val{fill:var(--ink);font-weight:700}
.rank{display:flex;flex-direction:column;gap:10px}
.rank-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:15px}
.rank-row i{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--y2)}
.rank-row i b{display:block;height:100%;border-radius:4px;background:var(--y)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mus);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.price{width:96px;font:inherit;font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.add-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.add-form input,.add-form select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.add-form input[type=text]{flex:1 1 180px}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .2s}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{transform:translateX(18px)}
.p-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.money{font-family:var(--f-disp);font-weight:800;font-size:44px;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;background:var(--y)}
.meter b.full{background:var(--bad)}
input[type=range]{width:100%;accent-color:var(--ink)}
.allow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 24px}
.allow h4{grid-column:1/-1;margin:8px 0 0;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mus)}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line);font-size:15px}
.hrow:last-child{border-bottom:0}
.hrow small{display:block;color:var(--soft);font-size:13px}

/* janela e aviso */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);border-radius:28px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;border:3px solid var(--ink)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;box-shadow:6px 6px 0 var(--ink);font-weight:600;font-size:15px;max-width:340px;animation:drop .35s ease}

@media (max-width:1100px){.stage{grid-template-columns:minmax(0,1fr)}.stage>.center{order:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.p-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.kb{grid-template-columns:minmax(0,1fr)}.kcol{min-height:0}.brand span{display:none}.reset{display:none}}
@media (max-width:520px){.phone.fit{width:100%;height:calc(100vh - 110px);padding:0;background:transparent;border-radius:0}.phone.fit .ph{border-radius:24px;border:2px solid var(--line)}.phone.fit .ph-status{display:none}.kpis{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* celular de verdade: o app do aluno ocupa a tela inteira, sem moldura nem abas da demo */
body.solo::before,body.solo .top{display:none}
body.solo .wrap{padding:0;max-width:none}
body.solo .phone,body.solo .phone.fit{width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;background:var(--bg)}
body.solo .phone .ph,body.solo .phone.fit .ph{border-radius:0;border:0}
body.solo .ph-status{display:none}
body.solo .ph-head{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
body.solo .ph-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
body.solo .banner{top:calc(10px + env(safe-area-inset-top,0px))}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="28" fill="#FFC21A"/><path d="M70 26 H44 A12 12 0 0 0 44 50 H56 A12 12 0 0 1 56 74 H30" stroke="#211B14" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>snackly</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Telas">
      <button class="tab" role="tab" data-tab="ao-vivo">Ao vivo</button>
      <button class="tab" role="tab" data-tab="aluno">Aluno</button>
      <button class="tab" role="tab" data-tab="cozinha">Cozinha</button>
      <button class="tab" role="tab" data-tab="admin">Admin</button>
      <button class="tab" role="tab" data-tab="pais">Pais</button>
    </nav>
    <button class="reset" id="reset" data-a="reset">Reiniciar demo</button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-ao-vivo">
    <div class="stage">
      <div class="center" id="h-phone-a"></div>
      <div id="h-kit-a"></div>
    </div>
  </section>
  <section class="view" id="v-aluno" hidden><div class="center" id="h-phone-b"></div></section>
  <section class="view" id="v-cozinha" hidden><div id="h-kit-b"></div></section>
  <section class="view" id="v-admin" hidden></section>
  <section class="view" id="v-pais" hidden></section>
</main>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- dados de exemplo ---------- */
var MENU0=[
  {id:'xsalada',n:'X-salada',c:'lanches',p:14,d:'Hambúrguer, queijo, alface e tomate'},
  {id:'misto',n:'Misto quente',c:'lanches',p:9,d:'Pão de forma, presunto e queijo'},
  {id:'wrap',n:'Wrap de frango',c:'lanches',p:15,d:'Frango desfiado, cenoura e requeijão'},
  {id:'coxinha',n:'Coxinha',c:'salgados',p:7,d:'Frango com catupiry'},
  {id:'paoqueijo',n:'Pão de queijo',c:'salgados',p:6,d:'Porção com 3 unidades'},
  {id:'esfiha',n:'Esfiha de carne',c:'salgados',p:6.5,d:'Massa fina, assada'},
  {id:'suco',n:'Suco de laranja',c:'bebidas',p:7,d:'Natural, 300 ml'},

function chime(kind){
  if(!ac)return;var notes=kind==='pronto'?[660,880,1175]:[523,784];
  notes.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.13;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.4);});

function check(){
  var list=cartList(),total=cartTotal(),errs=[],why=[];
  list.forEach(function(x){if(!x.m.on){errs.push('<b>'+esc(x.m.n)+'</b> acabou. Tire da sacola para continuar.');}});
  if(ui.sid==='davi'){
    var w=S.wallet;
    list.forEach(function(x){if(w.bloq.indexOf(x.m.id)>=0){errs.push('<b>'+esc(x.m.n)+'</b> foi bloqueado pelo seu responsável.');why.push('Item bloqueado: '+x.m.n);}});
    var g=spentToday(),resta=r2(w.limite-g);
    if(total>resta+.001){errs.push('Passa do limite diário. Hoje já foram '+brl(g)+' de '+brl(w.limite)+'; dá para gastar mais '+brl(Math.max(0,resta))+'.');why.push('Limite diário de '+brl(w.limite));}
    if(total>w.saldo+.001){errs.push('Saldo insuficiente: há '+brl(w.saldo)+' na carteira.');why.push('Saldo insuficiente');}

  return {list:list,total:total,errs:errs,why:why};

  return h+'<div class="hist">'+mine.map(function(o){return '<button class="box" data-a="open-order" data-id="'+o.id+'" style="text-align:left"><div class="line"><b class="mono">#'+c3(o.code)+'</b><span class="pill'+(o.st==='pronto'?' k':o.st==='entregue'?'':' ok')+'">'+stLabel(o.st)+'</span></div><span class="soft" style="font-size:14px">'+(isToday(o.t.pago)?'Hoje':'Ontem')+', '+hm(o.t.pago)+' · '+o.items.map(function(i){return i.q+'× '+esc(i.n);}).join(', ')+'</span><b class="num">'+brl(o.total)+'</b></button>';}).join('')+'</div>';
}
function phoneFoot(){
  var s=ui.screen,a=ALUNOS[ui.sid],h='<div class="ph-foot">';
  if(s==='menu'&&cartCount())h+='<button class="cartbar" data-a="go" data-s="cart"><span>Ver sacola · '+cartCount()+(cartCount()>1?' itens':' item')+'</span><span class="num">'+brl(cartTotal())+'</span></button>';
  if(s==='cart'&&cartCount()){var c=check();h+='<button class="btn y" data-a="'+(a.pay==='pix'?'to-pix':'pay-saldo')+'">'+(a.pay==='pix'?'Pagar com Pix':'Pagar com saldo')+' · '+brl(c.total)+'</button>';}
  if(s==='pix')h+='<button class="btn y" data-a="pix-ok">Simular pagamento aprovado</button>';
  if(s!=='pix'&&s!=='cart')h+='<div class="ph-tabs"><button data-a="go" data-s="menu" aria-pressed="'+(s==='menu')+'">Cardápio</button><button data-a="go" data-s="hist" aria-pressed="'+(s==='hist'||s==='order')+'">Meus pedidos</button></div>';
  return h+'</div>';
}

/* QR de exemplo: só visual */
function drawQR(){
  var cv=document.getElementById('qr');if(!cv)return;var x=cv.getContext('2d'),n=33,r=rng(S.nextCode*7919);
  x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#211B14';
  for(var i=0;i<n;i++)for(var j=0;j<n;j++)if(r()<.48)x.fillRect(i,j,1,1);
  [[0,0],[n-7,0],[0,n-7]].forEach(function(p){x.fillStyle='#fff';x.fillRect(p[0]-1<0?0:p[0]-1,p[1]-1<0?0:p[1]-1,9,9);x.fillStyle='#211B14';x.fillRect(p[0],p[1],7,7);x.fillStyle='#fff';x.fillRect(p[0]+1,p[1]+1,5,5);x.fillStyle='#211B14';x.fillRect(p[0]+2,p[1]+2,3,3);});
}

/* ---------- cozinha ---------- */
function kitchen(){
  var live=S.orders.filter(function(o){return o.st!=='entregue';});
  var col=function(st){return live.filter(function(o){return o.st===st;}).sort(function(a,b){return a.t.pago-b.t.pago;});};
  var done=S.orders.filter(function(o){return o.st==='entregue'&&isToday(o.t.pago);}).length;
  var h='<div class="kit"><div class="kit-head"><div><p class="eyebrow">Painel da cozinha · Sônia</p><h2>Pedidos ao vivo</h2></div><div class="stats"><span class="pill">Entregues hoje <b class="num">'+done+'</b></span></div></div><div class="kb">';
  [['novo','Novos','Começar preparo'],['prep','Preparando','Marcar pronto'],['pronto','Prontos para retirar','Entregar']].forEach(function(c){
    var list=col(c[0]);
    h+='<div class="kcol'+(c[0]==='pronto'?' ready':'')+'"><h3>'+c[1]+'<span class="num">'+list.length+'</span></h3>';
    if(!list.length)h+='<p class="empty">Nada aqui agora.</p>';
    list.forEach(function(o){
      var fresh=ui.flash[o.id]&&Date.now()-ui.flash[o.id]<2500;
      var ref=c[0]==='pronto'?o.t.pronto:o.t.pago,late=c[0]!=='pronto'&&mins(Date.now()-o.t.pago)>=8;
      h+='<div class="kcard'+(fresh?' fresh':'')+'"><div class="line"><span class="kc num">'+c3(o.code)+'</span><span class="pill since'+(late?' late':'')+'" data-since="'+ref+'" data-late="'+(c[0]!=='pronto'?1:0)+'">'+sinceTxt(ref)+'</span></div>';
      h+='<p style="font-size:14px"><b>'+esc(o.nome)+'</b> <span class="soft">· '+(o.pay==='pix'?'Pix':'Saldo')+'</span></p>';
      h+='<ul>'+o.items.map(function(i){return '<li><b>'+i.q+'×</b> '+esc(i.n)+'</li>';}).join('')+'</ul>';
      h+='<button class="btn'+(c[0]==='prep'?' y':'')+'" data-a="adv" data-id="'+o.id+'">'+c[2]+'</button></div>';
    });
    h+='</div>';
  });
  return h+'</div></div>';
}
function advance(id){
  var o=S.orders.find(function(x){return x.id===id;});if(!o)return;var now=Date.now();
  if(o.st==='novo'){o.st='prep';o.t.prep=now;}
  else if(o.st==='prep'){o.st='pronto';o.t.pronto=now;}
  else if(o.st==='pronto'){o.st='entregue';o.t.entregue=now;}
  commit();
}

/* ---------- admin ---------- */
function admin(){
  var today=S.orders.filter(function(o){return isToday(o.t.pago);});
  var fat=r2(today.reduce(function(s,o){return s+o.total;},0)),n=today.length;
  var ready=today.filter(function(o){return o.t.pronto;}),tm=ready.length?ready.reduce(function(s,o){return s+(o.t.pronto-o.t.pago);},0)/ready.length/60000:0;
  var pix=today.filter(function(o){return o.pay==='pix';}).length;
  var h='<div class="page-h"><div><p class="eyebrow">Painel da cantina · Sônia Ribeiro</p><h2>Vendas de hoje</h2></div><span class="pill k">Plano Intermediário · R$ 299/mês · sem comissão</span></div>';
  h+='<div class="kpis">'+
    '<div class="kpi y"><p class="eyebrow">Faturamento</p><strong>'+brl(fat)+'</strong><small>direto na conta da cantina</small></div>'+
    '<div class="kpi"><p class="eyebrow">Pedidos</p><strong>'+n+'</strong><small>'+Math.round(n?pix/n*100:0)+'% no Pix, o resto no saldo</small></div>'+
    '<div class="kpi"><p class="eyebrow">Ticket médio</p><strong>'+brl(n?fat/n:0)+'</strong><small>por pedido</small></div>'+
    '<div class="kpi"><p class="eyebrow">Tempo até ficar pronto</p><strong>'+tm.toFixed(1).replace('.',',')+' min</strong><small>média do dia</small></div></div>';
  /* pedidos por hora */
  var hrs={};today.forEach(function(o){var k=new Date(o.t.pago).getHours();hrs[k]=(hrs[k]||0)+1;});
  var keys=Object.keys(hrs).map(Number);var nowH=new Date().getHours();if(keys.indexOf(nowH)<0)keys.push(nowH);
  var lo=Math.min.apply(null,keys),hi=Math.max.apply(null,keys),slots=[];for(var k=lo;k<=hi;k++)slots.push(k);
  var max=Math.max.apply(null,slots.map(function(k){return hrs[k]||0;}).concat([1]));var top=Math.ceil(max/5)*5||5;
  var W=640,H=240,pl=34,pb=26,pt=16,cw=(W-pl-8)/slots.length,bw=Math.min(56,cw*.6);
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Pedidos por hora hoje">';
  for(var g=0;g<=top;g+=top/5){var y=pt+(H-pt-pb)*(1-g/top);svg+='<line class="grid" x1="'+pl+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+g+'</text>';}
  slots.forEach(function(k,i){var v=hrs[k]||0,bh=(H-pt-pb)*v/top,x=pl+cw*i+(cw-bw)/2,y=H-pb-bh;svg+='<rect class="bar'+(k===nowH?' now':'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(bh,0)+'" rx="6"/>';if(v)svg+='<text class="val" x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle">'+v+'</text>';svg+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+k+'h</text>';});
  svg+='</svg>';
  var cnt={};today.forEach(function(o){o.items.forEach(function(i){cnt[i.n]=(cnt[i.n]||0)+i.q;});});
  var rank=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,5),rmax=rank.length?cnt[rank[0]]:1;
  h+='<div class="grid2"><div class="panel chart"><h3>Pedidos por hora</h3><p class="soft" style="font-size:14px">Em preto, a hora atual.</p>'+svg+'</div>';
  h+='<div class="panel"><h3>Mais vendidos hoje</h3><div class="rank">'+rank.map(function(n){return '<div class="rank-row"><span>'+esc(n)+'</span><b class="num">'+cnt[n]+'</b><i><b style="width:'+Math.round(cnt[n]/rmax*100)+'%"></b></i></div>';}).join('')+'</div></div></div>';
  h+='<div class="panel"><div class="line" style="flex-wrap:wrap"><h3>Cardápio</h3><p class="soft" style="font-size:14px">Mudou aqui, muda na hora no app do aluno.</p></div><div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Categoria</th><th>Preço</th><th>Disponível</th></tr></thead><tbody>'+
    S.menu.map(function(m){return '<tr><td><b>'+esc(m.n)+'</b></td><td class="soft">'+CATS.find(function(c){return c[0]===m.c;})[1]+'</td><td><input class="price" id="price-'+m.id+'" type="text" inputmode="decimal" data-price="'+m.id+'" value="'+m.p.toFixed(2).replace('.',',')+'" aria-label="Preço de '+esc(m.n)+'"></td><td><label class="sw"><input type="checkbox" id="on-'+m.id+'" data-on="'+m.id+'"'+(m.on?' checked':'')+'><span>'+(m.on?'Sim':'Esgotado')+'</span></label></td></tr>';}).join('')+
    '</tbody></table></div><form class="add-form" id="addform"><input type="text" id="new-n" placeholder="Novo item, ex.: Pastel de queijo" aria-label="Nome do item"><select id="new-c" aria-label="Categoria">'+CATS.slice(1).map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>';}).join('')+'</select><input type="text" id="new-p" class="price" placeholder="0,00" inputmode="decimal" aria-label="Preço"><button class="btn auto">Adicionar</button></form></div>';
  h+='<p class="soft" style="font-size:13px;margin-top:14px">Cardápio, preços e pedidos anteriores são exemplos para a demonstração.</p>';
  return h;
}

/* ---------- pais ---------- */
function parents(){
  var w=S.wallet,g=spentToday(),pct=Math.min(100,w.limite?g/w.limite*100:100);
  var h='<div class="page-h"><div><p class="eyebrow">Área dos pais · Marcos Almeida</p><h2>Davi, 12 anos</h2></div><span class="pill">Avisos de compra ligados</span></div>';
  h+='<div class="p-grid">';
  h+='<div class="panel"><p class="eyebrow">Saldo na carteira</p><p class="money">'+brl(w.saldo)+'</p><div class="row">'+[20,50,100].map(function(v){return '<button class="btn ghost auto" data-a="topup" data-v="'+v+'">+ '+brl(v)+'</button>';}).join('')+'</div></div>';
  h+='<div class="panel"><p class="eyebrow">Gasto de hoje</p><p class="money">'+brl(g)+'</p><div class="meter"><b class="'+(pct>=100?'full':'')+'" style="width:'+pct+'%"></b></div><p class="soft" style="font-size:14px">de '+brl(w.limite)+' de limite por dia</p></div>';
  h+='<div class="panel"><p class="eyebrow">Limite diário</p><p class="money" id="lim-out">'+brl(w.limite)+'</p><input type="range" id="lim" min="5" max="60" step="1" value="'+w.limite+'" aria-label="Limite diário em reais"><p class="soft" style="font-size:14px">Acima disso, o app recusa a compra.</p></div>';
  h+='</div>';
  h+='<div class="panel" style="margin-bottom:16px"><div class="line" style="flex-wrap:wrap"><h3>O que o Davi pode comprar</h3><p class="soft" style="font-size:14px">Desligado: o item aparece bloqueado no app dele.</p></div><div class="allow">';
  CATS.slice(1).forEach(function(c){h+='<h4>'+c[1]+'</h4>';S.menu.filter(function(m){return m.c===c[0];}).forEach(function(m){var ok=w.bloq.indexOf(m.id)<0;h+='<label class="sw"><input type="checkbox" id="allow-'+m.id+'" data-allow="'+m.id+'"'+(ok?' checked':'')+'><span>'+esc(m.n)+'</span></label>';});});
  h+='</div></div>';
  var hist=S.orders.filter(function(o){return o.sid==='davi';}).slice().reverse();
  h+='<div class="grid2"><div class="panel"><h3>Histórico de consumo</h3><div>'+(hist.length?hist.map(function(o){return '<div class="hrow"><span class="pill">'+(isToday(o.t.pago)?'Hoje':'Ontem')+' '+hm(o.t.pago)+'</span><span>'+o.items.map(function(i){return i.q+'× '+esc(i.n);}).join(', ')+'<small>'+stLabel(o.st)+'</small></span><b class="num">'+brl(o.total)+'</b></div>';}).join(''):'<p class="soft">Sem compras.</p>')+
    w.rec.slice().reverse().map(function(r){return '<div class="hrow"><span class="pill ok">'+(isToday(r.t)?'Hoje':'Ontem')+' '+hm(r.t)+'</span><span>Recarga no Pix</span><b class="num" style="color:var(--ok)">+'+brl(r.v)+'</b></div>';}).join('')+'</div></div>';
  h+='<div class="panel"><h3>Compras recusadas</h3>'+(w.tent.length?'<div>'+w.tent.map(function(t){return '<div class="hrow"><span class="pill bad">'+hm(t.t)+'</span><span>'+esc(t.motivo)+'</span><b class="num">'+(t.v?brl(t.v):'')+'</b></div>';}).join('')+'</div>':'<p class="soft">Nenhuma tentativa recusada hoje.</p>')+'</div></div>';
  return h;
}

/* ---------- desenho ---------- */
function render(){
  var solo=isSolo(),tab=solo?'aluno':ui.tab;
  document.body.classList.toggle('solo',solo);
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===ui.tab);});
  document.querySelectorAll('.view').forEach(function(v){v.hidden=v.id!=='v-'+tab;});
  var pb=document.getElementById('phbody'),st=pb?pb.scrollTop:0,ks=window.scrollY;
  ['h-phone-a','h-phone-b','h-kit-a','h-kit-b'].forEach(function(id){document.getElementById(id).innerHTML='';});
  if(tab==='ao-vivo'){document.getElementById('h-phone-a').innerHTML=phone(false);document.getElementById('h-kit-a').innerHTML=kitchen();}
  if(tab==='aluno')document.getElementById('h-phone-b').innerHTML=phone(true);
  if(tab==='cozinha')document.getElementById('h-kit-b').innerHTML=kitchen();
  document.getElementById('v-admin').innerHTML=tab==='admin'?admin():'';
  document.getElementById('v-pais').innerHTML=tab==='pais'?parents():'';
  var nb=document.getElementById('phbody');if(nb&&ui.keepScroll)nb.scrollTop=st;ui.keepScroll=false;
  drawQR();modal();tick();
}
function modal(){
  var m=document.getElementById('modal');
  if(!ui.modal){m.innerHTML='';return;}
  m.innerHTML='<div class="modal" data-a="close-modal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Recarga no Pix"><p class="eyebrow">Recarga para o Davi</p><h3 style="font-size:24px">Pague '+brl(ui.modal.v)+' no Pix</h3><div class="qr"><canvas id="qr" width="33" height="33" aria-label="QR Code de exemplo"></canvas></div><p class="note y">Pix simulado para a apresentação.</p><button class="btn y" data-a="topup-ok">Simular pagamento aprovado</button><button class="btn ghost" data-a="close-modal">Cancelar</button></div></div>';
  drawQR();
}
function toast(t){var el=document.createElement('div');el.className='toast';el.textContent=t;document.getElementById('toasts').appendChild(el);setTimeout(function(){el.remove();},3500);}
function tick(){
  document.querySelectorAll('[data-clock]').forEach(function(e){e.textContent=hm(Date.now());});
  document.querySelectorAll('[data-since]').forEach(function(e){var t=+e.dataset.since;e.textContent=sinceTxt(t);if(e.dataset.late==='1')e.classList.toggle('late',mins(Date.now()-t)>=8);});
  var p=document.querySelector('[data-pix]');if(p){var left=Math.max(0,300-Math.floor((Date.now()-ui.pixAt)/1000));p.textContent=Math.floor(left/60)+':'+('0'+left%60).slice(-2);}
}
setInterval(tick,1000);

/* ---------- ações ---------- */
document.addEventListener('click',function(e){
  var tb=e.target.closest('.tab');if(tb){location.hash=tb.dataset.tab;return;}
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
  if(a==='close-modal'&&b.classList.contains('modal')&&e.target!==b)return;
  switch(a){
    case 'who':ui.sid=ui.sid==='rafa'?'davi':'rafa';ui.cart={};ui.screen='menu';ui.blocked=null;render();break;
    case 'cat':ui.cat=b.dataset.c;ui.blocked=null;render();break;
    case 'inc':
      if(ui.sid==='davi'&&S.wallet.bloq.indexOf(id)>=0){ui.blocked=id;ui.keepScroll=true;logTry(['Item bloqueado: '+menuItem(id).n],menuItem(id).p);commit();break;}
      ui.blocked=null;ui.cart[id]=(ui.cart[id]||0)+1;ui.keepScroll=true;render();break;
    case 'dec':ui.cart[id]=Math.max(0,(ui.cart[id]||0)-1);if(!ui.cart[id])delete ui.cart[id];ui.keepScroll=true;if(ui.screen==='cart'&&!cartCount())ui.screen='menu';render();break;
    case 'go':ui.screen=b.dataset.s;ui.blocked=null;render();break;
    case 'open-order':ui.orderId=id;ui.screen='order';render();break;
    case 'to-pix':var c=check();if(c.errs.length){render();break;}ui.pixAt=Date.now();ui.screen='pix';render();break;
    case 'pix-ok':createOrder('pix');toast('Pix aprovado. Pedido enviado para a cozinha.');break;
    case 'pay-saldo':var c2=check();if(c2.errs.length){if(c2.why.length){logTry(c2.why,c2.total);commit();}else render();break;}createOrder('saldo');toast('Pago com saldo. Pedido enviado para a cozinha.');break;
    case 'copy':var inp=document.getElementById('pixcode');try{navigator.clipboard.writeText(inp.value).then(function(){toast('Código Pix copiado.');},function(){inp.select();});}catch(err){inp.select();}break;
    case 'adv':advance(id);break;
    case 'topup':ui.modal={v:+b.dataset.v};modal();break;
    case 'topup-ok':S.wallet.saldo=r2(S.wallet.saldo+ui.modal.v);S.wallet.rec.push({t:Date.now(),v:ui.modal.v});toast('Recarga de '+brl(ui.modal.v)+' confirmada.');ui.modal=null;commit();break;
    case 'close-modal':ui.modal=null;modal();break;
    case 'reset':
      if(ui.resetArm&&Date.now()-ui.resetArm<4000){S=seed();known=null;ui.cart={};ui.screen='menu';ui.notif=null;ui.blocked=null;ui.resetArm=0;b.textContent='Reiniciar demo';b.classList.remove('arm');commit();toast('Demo reiniciada.');}
      else{ui.resetArm=Date.now();b.textContent='Confirmar reinício';b.classList.add('arm');setTimeout(function(){if(ui.resetArm&&Date.now()-ui.resetArm>=4000){ui.resetArm=0;b.textContent='Reiniciar demo';b.classList.remove('arm');}},4100);}
      break;
  }
});
function parsePrice(v){var n=parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(',','.'));return isFinite(n)&&n>0?r2(n):null;}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.price){var m=menuItem(t.dataset.price),n=parsePrice(t.value);if(n===null){toast('Preço inválido. Use um valor como 7,50.');t.value=m.p.toFixed(2).replace('.',',');return;}m.p=n;commit();toast(m.n+' agora custa '+brl(n)+'.');}
  else if(t.dataset.on){menuItem(t.dataset.on).on=t.checked;commit();}
  else if(t.dataset.allow){var b=S.wallet.bloq,i=b.indexOf(t.dataset.allow);if(t.checked&&i>=0)b.splice(i,1);if(!t.checked&&i<0)b.push(t.dataset.allow);commit();}
  else if(t.id==='lim'){S.wallet.limite=+t.value;commit();}
});
document.addEventListener('input',function(e){if(e.target.id==='lim'){document.getElementById('lim-out').textContent=brl(+e.target.value);}});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addform')return;e.preventDefault();
  var n=document.getElementById('new-n').value.trim(),c=document.getElementById('new-c').value,p=parsePrice(document.getElementById('new-p').value);
  if(!n||p===null){toast('Preencha o nome e o preço do item.');return;}
  S.menu.push({id:'x'+Date.now(),n:n,c:c,p:p,d:'',on:true});commit();toast(n+' entrou no cardápio.');
});
var TABS=['ao-vivo','aluno','cozinha','admin','pais'];
function route(){var h=location.hash.slice(1);ui.tab=TABS.indexOf(h)>=0?h:'ao-vivo';ui.modal=null;render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

S=load();detect();route();
})();
</script>
